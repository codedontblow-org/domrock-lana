name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    # Os testes usam fakes e nunca chamam a LLM, mas as configuracoes da IA sao obrigatorias
    # na importacao dos modulos (app/core/config.py); valores ficticios bastam.
    env:
      AI_PROVIDER: GEMINI
      AI_MODEL: modelo-de-teste
      GEMINI_API_KEY: chave-de-teste
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      # Mesma versao do Dockerfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instala dependencias
        run: pip install -r requirements-dev.txt

      # Inclui o runner real do codigo gerado (subprocesso com rlimits), que precisa de Linux
      - name: Testes
        run: python -m pytest -q

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: camplana-lana:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
